spring:
  application:
    name: apiGateway

  cloud:
    gateway:
      routes:
        # Inventory Service
        - id: inventoryService
          uri: lb://INVENTORYSERVICE
          predicates:
            - Path=/api/v1/inventory/**

        # Order Service
        - id: orderService
          uri: lb://ORDERSERVICE
          predicates:
            - Path=/api/v1/inventory/orders/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG